# 의존성 업데이트 PR을 매주 월요일에 만든다. 나온 지 14일이 지난 버전만 제안해,
# 막 나온 버전의 문제를 피한다. 작은(minor·patch) 업데이트는 한 PR로 묶는다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      # 앱은 Node 22에서 실행되므로 Node 타입 정의의 큰 버전은 Node를 올릴 때 직접 맞춘다.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Next.js의 린트 설정(eslint-config-next)이 아직 지원하지 않는다. 지원되면 이 항목을 지운다.
      # TypeScript 7: typescript-eslint 미지원 / ESLint 10: eslint-plugin-react 미지원 (2026-10-16 확인)
      - dependency-name: "typescript"
        versions:
          - ">=7"
      - dependency-name: "eslint"
        versions:
          - ">=10"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 14
