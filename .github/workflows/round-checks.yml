name: Round checks

on:
  push:
  pull_request:

jobs:
  browser-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://browser-tests.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_browser_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 빈 DB에 마이그레이션 전체를 적용하고 권한·회원가입·라운드 잠금 DB 테스트를 실행한다.
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      # LayoutProps 같은 라우트 타입은 Next가 생성하므로 빌드 전 타입 검사보다 먼저 만든다.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:e2e
